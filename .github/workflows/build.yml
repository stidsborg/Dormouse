name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dormouse.slnx

      - name: Build
        run: dotnet build Dormouse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Dormouse.slnx --configuration Release --no-build
